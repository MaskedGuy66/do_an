[project]
name = "cv-screener-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "MaskedGuy66",email = "nduy0021@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1,<0.138.0",
    "uvicorn>=0.49.0,<0.50.0",
    "pydantic>=2.13.4,<3.0.0",
    "sqlalchemy>=2.0.51,<3.0.0",
    "python-multipart>=0.0.32,<0.0.33",
    "pypdf>=6.13.3,<7.0.0",
    "google-genai>=2.10.0,<3.0.0",
    "fpdf>=1.7.2,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pillow (>=12.3.0,<13.0.0)"
]
